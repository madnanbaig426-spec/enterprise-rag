services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: enterprise-rag-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - ./backend/uploads:/app/uploads

    depends_on:
      - qdrant

    networks:
      - enterprise-rag-network


  qdrant:
    image: qdrant/qdrant:latest

    container_name: enterprise-rag-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - enterprise-rag-network


networks:

  enterprise-rag-network:
    driver: bridge


volumes:

  qdrant_data:
